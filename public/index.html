<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>NCR Messenger</title>

  <link
    rel="manifest"
    href="/manifest.json"
  >

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <link
    rel="apple-touch-icon"
    href="/icons/icon-192.png"
  >
</head>

<body>

  <div id="app">

    <!-- =========================
         LOGIN
    ========================== -->

    <section
      id="login-screen"
      class="screen login-screen"
    >

      <div class="login-card">

        <div class="logo">
          NCR
        </div>

        <h1>NCR Messenger</h1>

        <p class="subtitle">
          Защищённый демонстрационный
          мессенджер
        </p>

        <label
          class="field-label"
          for="username-input"
        >
          Имя пользователя
        </label>

        <input
          type="text"
          id="username-input"
          placeholder="Например: Dmitry"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
        >

        <label
          class="field-label"
          for="password-input"
        >
          Пароль
        </label>

        <input
          type="password"
          id="password-input"
          placeholder="Пароль"
          autocomplete="current-password"
        >

        <button
          id="register-btn"
          class="primary-button"
        >
          Войти / Регистрация
        </button>

        <p
          id="login-error"
          class="error"
          role="alert"
        ></p>

        <p class="hint">
          Если имя свободно — будет создан
          новый аккаунт. Если имя уже занято —
          пароль должен совпадать.
        </p>

      </div>

    </section>


    <!-- =========================
         CHAT
    ========================== -->

    <section
      id="chat-screen"
      class="screen chat-screen hidden"
    >

      <header class="chat-header">

        <div class="user-info">

          <div class="avatar">
            <span id="avatar-letter">
              ?
            </span>
          </div>

          <div>

            <div
              id="current-user"
              class="current-user"
            ></div>

            <div
              id="chat-status"
              class="chat-status"
            >
              Подключение…
            </div>

          </div>

        </div>

        <div class="header-actions">

          <button
            id="refresh-btn"
            class="icon-button"
            type="button"
            aria-label="Обновить сообщения"
            title="Обновить"
          >
            ↻
          </button>

          <button
            id="logout-btn"
            class="secondary-button"
            type="button"
          >
            Выйти
          </button>

        </div>

      </header>


      <main
        id="messages"
        class="messages"
      >

        <div class="empty-chat">
          <div class="empty-icon">
            💬
          </div>

          <strong>
            Пока нет сообщений
          </strong>

          <span>
            Введите имя получателя ниже
            и отправьте сообщение.
          </span>
        </div>

      </main>


      <footer class="composer">

        <div class="recipient-line">

          <label for="recipient-input">
            Кому
          </label>

          <input
            type="text"
            id="recipient-input"
            placeholder="Имя пользователя"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
          >

        </div>


        <div class="message-line">

          <textarea
            id="message-input"
            rows="1"
            placeholder="Напишите сообщение…"
            autocomplete="off"
            spellcheck="true"
          ></textarea>

          <button
            id="send-btn"
            class="send-button"
            type="button"
          >
            Отправить
          </button>

        </div>

        <div class="composer-hint">
          Enter — отправить · Shift + Enter —
          новая строка
        </div>

      </footer>

    </section>

  </div>

  <script src="/ncr-lwe.js"></script>
  <script src="/app.js"></script>

</body>
</html>
