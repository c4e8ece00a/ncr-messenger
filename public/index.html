<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NCR-LWE Messenger</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
  <div id="app">
    <div id="login-screen" class="screen">
      <h1>NCR Messenger</h1>
      <input type="text" id="username-input" placeholder="Ваше имя" autocomplete="off">
      <button id="register-btn">Войти</button>
      <p id="login-error" class="error"></p>
      <p><small>Для push-уведомлений добавьте приложение на домашний экран.</small></p>
    </div>
    <div id="chat-screen" class="screen hidden">
      <header>
        <span id="current-user"></span>
        <button id="logout-btn">Выйти</button>
      </header>
      <main id="messages"></main>
      <footer>
        <input type="text" id="recipient-input" placeholder="Кому (имя)">
        <input type="text" id="message-input" placeholder="Сообщение">
        <button id="send-btn">Отправить</button>
      </footer>
    </div>
  </div>
  <script src="/ncr-lwe.js"></script>
  <script src="/app.js"></script>
</body>
</html>
